name: repro-3578

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  parser-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: go.mod
      - name: parse-buffer-lab
        run: go run ./cmd/parse-buffer-lab
      - name: verify fixture package (#1)
        run: ./scripts/verify-fixtures-package.sh

  ebpf-compose-smoke:
    runs-on: ubuntu-latest
    needs: parser-and-fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: go.mod
      - name: Compose smoke (openresty sidecar, OBI attaches)
        env:
          REQUIRE_EBPF_FALLBACK: "0"
          COMPOSE_FILES: "-f docker-compose.yml -f docker-compose.openresty.yml"
        run: ./run-repro.sh

  ebpf-repro-signoff:
    runs-on: ubuntu-latest
    needs: ebpf-compose-smoke
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: go.mod
      - name: Sign-off gate (parse fallback + missing Authorization on /)
        env:
          REQUIRE_EBPF_FALLBACK: "1"
          KEEP_COMPOSE_ON_FAILURE: "1"
          COMPOSE_FILES: "-f docker-compose.yml -f docker-compose.openresty.yml"
        run: ./run-repro.sh
      - name: Capture compose logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          DC="docker compose -f docker-compose.yml -f docker-compose.openresty.yml"
          $DC logs > ci-logs/compose.log 2>&1 || true
          $DC logs obi 2>&1 | tail -200 > ci-logs/obi-tail.log || true
      - name: Upload CI logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repro-3578-compose-logs
          path: ci-logs/
          retention-days: 14
      - name: Tear down compose
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.openresty.yml down -v || true
