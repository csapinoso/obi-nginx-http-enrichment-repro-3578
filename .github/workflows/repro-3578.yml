name: repro-3578

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  parser-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: go.mod
      - name: parse-buffer-lab
        run: go run ./cmd/parse-buffer-lab
      - name: verify fixture package (#1)
        run: ./scripts/verify-fixtures-package.sh

  ebpf-compose-linux:
    runs-on: ubuntu-latest
    needs: parser-and-fixtures
    steps:
      - uses: actions/checkout@v4
      - name: Linux compose repro (openresty + hostpid)
        env:
          REQUIRE_EBPF_FALLBACK: "1"
          KEEP_COMPOSE_ON_FAILURE: "1"
        run: ./run-repro.sh
      - name: Capture compose logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          DC="docker compose -f docker-compose.yml -f docker-compose.openresty.yml -f docker-compose.hostpid.yml"
          $DC logs > ci-logs/compose.log 2>&1 || true
          $DC logs obi 2>&1 | tail -200 > ci-logs/obi-tail.log || true
      - name: Upload CI logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repro-3578-compose-logs
          path: ci-logs/
          retention-days: 14
      - name: Tear down compose
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.openresty.yml -f docker-compose.hostpid.yml down -v || true
