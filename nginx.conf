daemon off;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;

  upstream backend {
    server upstream:8080;
  }

  server {
    listen 8080;

    # Default: buffered proxy, HTTP/1.1 to upstream.
    location / {
      include /etc/nginx/proxy-buffers.conf;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://backend;
    }

    # Unbuffered proxy — response may not land in OBI large buffers (see #3578).
    location /unbuffered/ {
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      rewrite ^/unbuffered/(.*)$ /$1 break;
      proxy_pass http://backend;
    }
  }
}
